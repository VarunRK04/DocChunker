[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docchunker"
version = "2.0.0"
description = "Ingest documents, chunk them, embed them, and search them - locally or with Pinecone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pymupdf>=1.23", "python-dotenv>=1.0"]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
openai = ["openai>=1.0"]
pinecone = ["pinecone>=5.0"]
docx = ["python-docx>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["docchunker[st,openai,pinecone,docx,api,dev]"]

[project.scripts]
docchunker = "docchunker.cli:main"

[tool.setuptools.packages.find]
include = ["docchunker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
